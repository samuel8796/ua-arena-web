name: Deploy UA Arena Web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Run UA Arena checks
        run: |
          node --check app.js
          node --check image-source.mjs
          node --check wide-crop-ui.mjs
          node --check avatar-crop-ui.mjs
          node --check avatar-crop-core.mjs
          node --check firebase-adapter.js
          node --check demo-adapter.js
          node tests.mjs
          node scripts/check-card-catalog.mjs
      - name: Test match, timer and tournament logic
        run: node tests.mjs
      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p dist/assets
          cp index.html app.js core.mjs image-source.mjs wide-crop-ui.mjs avatar-crop-ui.mjs avatar-crop-core.mjs tournament-core.mjs quick-core.mjs demo-adapter.js firebase-adapter.js firebase-config.js styles.css .nojekyll dist/
          cp assets/favicon.svg dist/assets/
          cp assets/streak-*.svg dist/assets/
          mkdir -p dist/data
          cp data/cards.zh-Hant.json dist/data/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
